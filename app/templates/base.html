<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  {# htmx injects an inline <style> for indicators unless told not to; the CSP
     (style-src 'self') would block it and log a violation on every page. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Orbit Ops{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/pygments.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/briefing.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/comms.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/laptop.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
  {# The desk (#38): a first-person pixel-art room, and the whole app on a
     laptop's screen. The room is decoration; everything you need is on the
     screen. The lid closes to show the room (#55, static/js/laptop.js). #}
  <div class="scene">
    <div class="room" aria-hidden="true">
      {% if window_event %}{% with event = window_event, oob = false %}{% include "partials/_window_event.html" %}{% endwith %}
      {% else %}<div id="window-event" class="window-event"></div>{% endif %}
    </div>
    <div class="laptop" id="laptop">
      <div class="laptop-deck" aria-hidden="true"></div>
      <div class="laptop-shut" aria-hidden="true"><span class="sleep-light"></span></div>
      <button type="button" class="laptop-open" aria-label="Open the laptop" hidden></button>
      <div class="lid">
        <span class="power-light"></span>
        <button type="button" class="lid-close" hidden>▾ Close lid</button>
        <div class="monitor">
          <div class="screen{{ ' has-comms' if console }}">
            <div class="screen-main">
              <header class="topbar">
                <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">◎</span> <span class="brand-name">Orbit Ops</span></a>
                {% if user %}
                <nav>
                  <a href="/syllabus">Syllabus</a>
                  <a href="/map">Map</a>
                  <a href="/badges">Badges</a>
                  <a href="/review">Review</a>
                  <span class="muted who">Cadet {{ user.username }}</span>
                  <form method="post" action="/logout" class="inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                    <button type="submit" class="link">Log out</button>
                  </form>
                </nav>
                {% endif %}
              </header>
              {% if console %}
              {% with oob = false %}{% include "partials/_readout.html" %}{% endwith %}
              {% endif %}
              <main class="container">
                {% block content %}{% endblock %}
              </main>
              <footer class="footer muted">Station <i>Meridian</i> · {% if app_version != 'dev' %}v{% endif %}{{ app_version }}</footer>
            </div>
            {% if console %}
            <aside class="comms" aria-labelledby="comms-title">
              <h2 class="comms-title" id="comms-title">Comms</h2>
              <ol class="comms-log" id="comms-log" role="log" aria-live="polite" aria-label="Messages">
                {% if not console.comms %}<li class="comms-empty muted">No messages yet. The crew will be in touch.</li>{% endif %}
                {% for line in console.comms %}{% include "partials/_comms_line.html" %}{% endfor %}
              </ol>
            </aside>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
