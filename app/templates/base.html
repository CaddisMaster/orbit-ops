<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  {# htmx injects an inline <style> for indicators unless told not to; the CSP
     (style-src 'self') would block it and log a violation on every page. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Orbit Ops{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/pygments.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/briefing.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">◎</span> <span class="brand-name">Orbit Ops</span></a>
    {% if user %}
    <nav>
      <a href="/syllabus">Syllabus</a>
      <a href="/map">Map</a>
      <a href="/badges">Badges</a>
      <span class="muted who">Cadet {{ user.username }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  {% if console %}
  {# The console readout: what's online and the streak, on every signed-in page. #}
  <div class="readout" role="status" aria-label="Station status">
    <span>Systems online <strong>{{ console.online }}/{{ console.systems }}</strong></span>
    <span>Streak <strong>{{ console.streak }}</strong></span>
  </div>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer muted">Station <i>Meridian</i> · {% if app_version != 'dev' %}v{% endif %}{{ app_version }}</footer>
</body>
</html>
