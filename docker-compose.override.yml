# Local development overrides. Compose reads this automatically; it is NOT
# present on the droplet.
services:
  db:
    # Dev only, so PyCharm's Database tool can browse it from the VM (#349).
    # Loopback, like every published port (Docker bypasses ufw). 5432 and 5434
    # are Budget Buddy's and MLIT's dev databases. Production's db stays
    # unpublished: this file is not on the droplet.
    ports:
      - "127.0.0.1:5435:5432"
  web:
    build:
      context: .
      target: dev
    image: ""
    # The production 256m cap is sized for one uvicorn process; ./test.sh runs
    # pytest-xdist workers inside this same container.
    mem_limit: 2g
    # Production's lockdown (#264) applies here too, so a change that writes to
    # disk fails locally first. Two exceptions for the suite: pytest-xdist's
    # workers and their threads outgrow 100 pids, and the backup-script tests
    # run a stub `docker` from pytest's tmp_path, which a noexec /tmp refuses.
    pids_limit: 1000
    tmpfs: !override
      - /tmp:exec
    volumes:
      - .:/app
      - /app/.venv
      - /app/.ruff_cache
      - /app/.pytest_cache
    environment:
      TEMPLATES_AUTO_RELOAD: "1"
    # The content catalog is loaded once at startup, so a lesson or syllabus
    # edit needs a reload too (#247). The includes need watchfiles, which
    # requirements-dev.txt installs; uvicorn's fallback watcher sees only *.py.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--reload-dir", "app", "--reload-dir", "content",
              "--reload-include", "*.md", "--reload-include", "*.yml"]
