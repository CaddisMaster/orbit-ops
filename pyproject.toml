[project]
name = "orbit-ops"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # naive datetimes — unlike BB, this app stores instants (tz-aware) and
           # derives "today" from APP_TIMEZONE explicitly, so naive is a bug here.
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# conftest sets SECRET_KEY before importing the app, by necessity.
"tests/conftest.py" = ["E402"]
# FastAPI's dependency-injection idiom is `x = Depends(...)` in the signature.
"app/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]
# The local alembic/ directory is migration scripts, not a package; without
# this, isort mistakes the `alembic` library for first-party code.
known-third-party = ["alembic"]
