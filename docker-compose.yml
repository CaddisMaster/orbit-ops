# Orbit Ops shares the droplet with Budget Buddy. Ports in use on the host:
#   budget-buddy web 127.0.0.1:5001, budget-buddy db 127.0.0.1:5432
#   orbit-ops    web 127.0.0.1:5002, orbit-ops db: NOT PUBLISHED
# Docker port publishing bypasses ufw, so every published port is bound to
# 127.0.0.1 and host Nginx is the only public entry point.
services:
  db:
    # Pinned by patch tag and digest (#266): a bare `postgres:16` let any pull
    # change the database under a running release. ci.yml's and release.yml's
    # test databases use the same reference (tests/test_repo_hardening.py).
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Sized for a 2 GB droplet running two apps. A single-user app needs very
    # little: 64 MB of shared buffers and a handful of connections.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` at all — nothing outside this compose network needs Postgres.
    # Migrations and backups go through `docker compose exec/run`.
    mem_limit: 256m
    # no-new-privileges, but NOT cap_drop: [ALL] (#266). The entrypoint starts
    # as root and needs CHOWN, SETUID, SETGID, FOWNER and DAC_OVERRIDE to fix
    # the data directory's ownership and drop to the postgres user. It drops
    # with gosu (a syscall), which no-new-privileges allows.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ Editing anything in this service makes the next `up -d` RECREATE the
    # database container. scripts/install_compose.sh refuses such a release;
    # apply it as a scheduled operation (RUNBOOK §5).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    # ⚠️ No default TAG on purpose (BB #190): a stale local `latest` once rolled
    # production back three releases silently. The deploy writes TAG= into .env.
    image: ghcr.io/caddismaster/orbit-ops:${TAG:?TAG is not set — pass TAG=<version>, or see RUNBOOK §5}
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:5002:8000"
    mem_limit: 256m
    # Locked down (#264). Nothing writes to disk at runtime (the catalog renders
    # into memory, logs go to stdout), so the root filesystem is read-only and
    # /tmp is the only writable place. uvicorn binds 8000, so no capability is
    # needed. pids counts threads: one process plus anyio's 40-thread pool.
    # release.yml's smoke run uses the same flags, so a release that can't
    # live with this fails before the production approval.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
