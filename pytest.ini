[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts = --dist loadgroup

# `criterion` claims an issue's acceptance-criteria scenario for this test:
#     @pytest.mark.criterion(12, "A wrong password is rejected")
# It does nothing at run time. scripts/check_criteria.py reads it from the
# source (CI's "Acceptance criteria" check), so both arguments must be literals.
markers =
    criterion(issue, title): this test implements acceptance-criteria scenario `title` of issue #`issue`
